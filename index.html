<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Baby Tracker</title>
    <meta
      name="description"
      content="Дневник малыша: сон, кормления, подгузники, рост, события «впервые» и напоминания"
    />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baby Tracker" />
    <meta name="theme-color" content="#fbf6f1" />
    <script>
      // GitHub Pages не умеет SPA-fallback: прямой заход по адресу вроде /baby-tracker/history
      // попадает на 404.html (scripts/generate-404.mjs), тот запоминает путь и перебрасывает
      // в корень приложения. Здесь путь восстанавливается без перезагрузки. В остальных
      // окружениях ключа в sessionStorage нет — скрипт ничего не делает.
      ;(function () {
        try {
          var redirect = sessionStorage.getItem('bt.spaRedirect')
          if (redirect) {
            sessionStorage.removeItem('bt.spaRedirect')
            history.replaceState(null, '', redirect)
          }
        } catch (error) {
          /* sessionStorage недоступен — откроется корень приложения */
        }
      })()
    </script>
    <script>
      // Применяем тему до первой отрисовки, иначе при тёмной теме мигает светлый фон.
      // Ключ должен совпадать с THEME_STORAGE_KEY в src/lib/theme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('bt.theme') || 'system'
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (error) {
          /* localStorage недоступен — остаёмся на системной теме */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
